# Workspace configuration.
#
# This file marks the workspace root — commands find it by walking up from the
# current directory, the way git finds `.git`.
#
# It holds no secrets. Tokens live in `.env`, which is gitignored.

mgmt:
  schema_version: 1
  # Which CLI versions may operate on this workspace. A scheduled run should
  # pin an exact version; a CLI that upgrades itself overnight and breaks is
  # the worst failure mode available.
  cli_range: ">=0.1.0 <0.2.0"

jira:
  # Any value here may be written as `${VAR}` and supplied from `.env` instead.
  # A hostname and a project key are not secrets, but they are the parts of this
  # file that identify a customer — and this file is committed. See .env.example.
  #
  #   base_url: "${JIRA_BASE_URL}"
  #   project: "${JIRA_PROJECT}"
  base_url: "https://jira.example.com"
  project: "PROJ"
  # Discovered by `mgmt doctor` — instance-specific, never guess it.
  epic_link_field: null

github:
  # Issue sources are read-only. Listing a repository here never grants write
  # access to it; the tool has no code path that writes to one.
  repos: []

  # API root. Change it for GitHub Enterprise Server, or to point the tool at a
  # local mock. Read-only applies whatever this points at.
  base_url: "https://api.github.com"

sync:
  # Closed tickets move to `archive/` after this many days. Nothing is deleted.
  archive_after_days: 30

  # Whether a scheduled run may sync this workspace.
  #
  # Off by default, and only one machine in a team should turn it on — several
  # machines syncing the same workspace on a timer produce conflicting commits
  # rather than faster syncs.
  #
  # `mgmt sync --apply --scheduled` does nothing while this is false, so the
  # cron entry can be installed once and left inert until it is wanted.
  # See docs/scheduling.md.
  scheduled: false
