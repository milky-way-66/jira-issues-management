# A real Jira Data Center instance on loopback, for manual verification only.
#
#   docker compose -f docker-compose.jira.yml up -d
#
# This is NOT part of the test loop. The automated suite runs against the
# in-process substitute in test/support/fake-jira.ts, which needs no licence,
# no container and no minutes of boot time.
#
# What this is for: the one thing a substitute cannot prove — that the field
# mapping matches what a real instance actually returns. See docs/local-jira.md.

services:
  jira:
    image: atlassian/jira-software:9.12
    ports:
      - '127.0.0.1:8080:8080' # loopback only; never expose this
    environment:
      ATL_JDBC_URL: jdbc:postgresql://db:5432/jira
      ATL_JDBC_USER: jira
      ATL_JDBC_PASSWORD: jira
      ATL_DB_DRIVER: org.postgresql.Driver
      ATL_DB_TYPE: postgres72
      JVM_MINIMUM_MEMORY: 1024m
      JVM_MAXIMUM_MEMORY: 2048m
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - jira-data:/var/atlassian/application-data/jira

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: jira
      POSTGRES_USER: jira
      POSTGRES_PASSWORD: jira
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jira']
      interval: 5s
      retries: 20
    volumes:
      - jira-db:/var/lib/postgresql/data

volumes:
  jira-data:
  jira-db:
